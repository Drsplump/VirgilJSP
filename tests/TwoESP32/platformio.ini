; Project: TwoESP32
; PlatformIO configuration for two ESP32 test targets.

[platformio]
default_envs = esp32sensor

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
	symlink://../..
	bblanchon/ArduinoJson @ ^7.0.4

[env:esp32sensor]
board = esp32dev
build_src_filter = +<sensor/*> -<receiver/*>
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX

[env:esp32receiver]
board = esp32dev
build_src_filter = +<receiver/*> -<sensor/*>
; upload_port = /dev/cu.usbserial-YYYY
; monitor_port = /dev/cu.usbserial-YYYY
